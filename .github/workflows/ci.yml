name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain CI actually tests with. NOT pinned to go.mod's `go` directive:
  # Go 1.22's Mach-O linker omits LC_UUID, and macOS 26's dyld refuses to load
  # such binaries ("missing LC_UUID load command", then abort trap), so every
  # test binary dies before running. Unrelated to Nimbus -- it hits any Go 1.22
  # build on current macOS. The go.mod floor is covered by the minimum-go job.
  GO_VERSION: "stable"
  # The `go` directive in go.mod: the oldest toolchain we claim to support.
  GO_MIN_VERSION: "1.22"
  # Every Terraform example, applied/planned/destroyed by the terraform job.
  # Add new ones here.
  EXAMPLES: "azure-basic azure-storage"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # stdlib-only, so there is no go.sum

      # gofmt only needs checking once, and only on Linux: a CRLF checkout on
      # Windows makes it report every file.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: go build -o bin/nimbus ./cmd/nimbus

      # The main module must stay stdlib-only (see CLAUDE.md). Check at module
      # level: `go list -deps` also reports the stdlib's own vendored
      # golang.org/x/... packages, which are not dependencies of ours.
      - name: no third-party dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          mods=$(go list -m all | grep -v '^github.com/Asere231/nimbus$' || true)
          if [ -n "$mods" ]; then
            echo "The main module must be stdlib-only, but it requires:"
            echo "$mods"
            exit 1
          fi

  # The language level in go.mod must keep compiling on the oldest toolchain we
  # claim to support. Linux only: see the GO_VERSION comment above for why 1.22
  # cannot run its own test binaries on current macOS.
  minimum-go:
    name: oldest supported Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_MIN_VERSION }}
          cache-dependency-path: go.mod
      - run: go build ./...
      - run: go test ./...

  visualizer:
    name: visualizer (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The visualizer has no build step and no dependencies, so there is
      # nothing to install: node's own test runner runs the modules straight
      # from internal/ui/static. The Go side checks that every import in
      # those modules resolves (TestEveryModuleImportResolves).
      #
      # No package.json anywhere in the repo, so node decides these .js files
      # are ES modules by reading them -- syntax detection, on by default
      # since 22.7. Hence a pinned major rather than whatever is oldest.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/ui/

  specgen:
    name: spec generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/specgen/go.mod
      # The generator's own tests run against the fixtures under testdata and
      # need no network. Regenerating would, so it is not done here: the
      # generated table is committed and reviewed like any other code.
      - name: Test the generator
        working-directory: tools/specgen
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  bicep:
    name: bicep deployment (az)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # The az CLI is preinstalled on GitHub's Ubuntu runners.
      - name: Register Nimbus as a cloud and sign in
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          ./bin/nimbus az register --run
          az login --service-principal \
            -u 00000000-0000-0000-0000-000000000002 -p nimbus \
            --tenant 00000000-0000-0000-0000-000000000001 --allow-no-subscriptions

      - name: az group create / vnet create / resource list
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az group create -n rg-ci -l eastus
          az network vnet create -g rg-ci -n vnet-ci --address-prefixes 10.0.0.0/16
          az resource list -g rg-ci -o table

      # Deploys the committed ARM JSON, which is exactly what az sends after
      # compiling the .bicep locally. Installing the Bicep compiler would need
      # another download, and the compiled output is what Nimbus must handle.
      - name: Deploy the Bicep example
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az deployment group create -g rg-ci -n ci-example \
            --template-file examples/bicep/main.json -o json > deployment.json
          cat deployment.json
          state=$(python3 -c "import json;print(json.load(open('deployment.json'))['properties']['provisioningState'])")
          [ "$state" = "Succeeded" ] || { echo "provisioningState=$state"; exit 1; }

      - name: The resources it created are really there
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az network vnet show -g rg-ci -n nimbus-vnet -o json > vnet.json
          subnets=$(python3 -c "import json;print(len(json.load(open('vnet.json'))['subnets']))")
          [ "$subnets" = "2" ] || { echo "the copy loop produced $subnets subnets"; exit 1; }
          az deployment group what-if -g rg-ci -n ci-example \
            --template-file examples/bicep/main.json --no-pretty-print

      - name: Deploying it again changes nothing
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az network vnet show -g rg-ci -n nimbus-vnet -o json > before.json
          az deployment group create -g rg-ci -n ci-example-2 \
            --template-file examples/bicep/main.json -o none
          az network vnet show -g rg-ci -n nimbus-vnet -o json > after.json
          diff before.json after.json || { echo "a redeploy changed the VNet"; exit 1; }

  sdkcompat:
    name: go-azure-sdk harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/sdkcompat/go.sum

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          # Wait for the visualizer rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: Run the SDK compatibility harness
        working-directory: test/sdkcompat
        # Unlike macOS, Go on Linux honours SSL_CERT_FILE, so the CA does not
        # need installing into a system trust store.
        run: |
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          go run . -endpoint https://localhost:4701

  storage-sdk:
    name: Azure SDK for Python harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/storage-sdk/requirements.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # The harness needs an account to exist; the example is how one is made.
      - name: Create a storage account
        working-directory: examples/terraform/azure-storage
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Drive blob, queue and table with the Python SDKs
        working-directory: test/storage-sdk
        run: ./run.sh stnimbusdata

  # AKS needs Docker, so it is its own job rather than part of the matrix.
  # GitHub's Linux runners have a daemon, so this really does boot k3s.
  aks:
    name: terraform azure-aks (k3s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Docker and k3s image
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1

      - name: Engine tests against a real daemon
        run: NIMBUS_DOCKER_TESTS=1 go test ./internal/engines/... -count=1

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, kubectl, scale, destroy
        working-directory: examples/terraform/azure-aks
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The cluster must be a real one, not just an ARM record.
          # `wait --all` errors immediately when nothing matches, so check the
          # nodes exist before waiting on their condition.
          kubectl --kubeconfig ./kubeconfig get nodes
          kubectl --kubeconfig ./kubeconfig wait --for=condition=Ready node --all --timeout=300s

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # node_count is real: scaling must add a node.
          terraform apply -auto-approve -input=false -var node_count=3
          for i in $(seq 1 40); do
            n=$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)
            [ "$n" -ge 3 ] && break
            sleep 5
          done
          kubectl --kubeconfig ./kubeconfig get nodes
          [ "$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)" -ge 3 ] || {
            echo "::error::scaling to node_count=3 did not add a node"; exit 1; }

          terraform destroy -auto-approve -input=false -var node_count=3

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.cluster)
          if [ -n "$left" ]; then
            echo "::error::destroy left containers running:"
            docker ps -a --filter label=nimbus.cluster
            exit 1
          fi

  # The milestone 4 example: a registry, a vault and a cluster together. Needs
  # Docker for both the registry and k3s, so it joins the aks job's shape
  # rather than the plain terraform matrix.
  app:
    name: terraform azure-app (ACR + Key Vault + AKS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Docker and images
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1
          docker pull registry:2
          docker pull nginx:alpine

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, pull from the local registry, read the secret
        working-directory: examples/terraform/azure-app
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The pod has to actually start, which means containerd really did
          # pull the image through the cluster's mirror of our registry.
          kubectl --kubeconfig ./kubeconfig get pods
          kubectl --kubeconfig ./kubeconfig rollout status deploy/app --timeout=300s

          # And the secret really came from the Key Vault data plane.
          got=$(kubectl --kubeconfig ./kubeconfig exec deploy/app -- printenv DB_PASSWORD)
          [ "$got" = "hunter2" ] || { echo "::error::DB_PASSWORD was \"$got\""; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

          # Destroy purges the vault, so the same name is free again. Applying
          # just the vault proves it without booting a second cluster.
          terraform apply -auto-approve -input=false -target=azurerm_key_vault.app
          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          # One filter per label: docker ANDs repeated label filters, so asking
          # for both at once would match nothing and always pass.
          for label in nimbus.cluster nimbus.registry; do
            left=$(docker ps -aq --filter "label=$label")
            if [ -n "$left" ]; then
              echo "::error::destroy left $label containers running:"
              docker ps -a --filter "label=$label"
              exit 1
            fi
          done

  terraform:
    name: terraform examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # so exit codes reach us unchanged

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, plan, destroy
        working-directory: examples/terraform
        run: |
          set -euo pipefail
          # Go on Linux honours SSL_CERT_FILE; the azurerm provider inherits it.
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"

          # Every example, not just the first. azure-storage exercises the data
          # plane -- Shared Key, XML, real bytes -- which shares the ARM write
          # path with everything else, so it is the example most likely to
          # catch collateral damage from an unrelated change.
          for example in ${{ env.EXAMPLES }}; do
            echo "::group::$example"
            cd "$GITHUB_WORKSPACE/examples/terraform/$example"
            terraform init -input=false
            terraform apply -auto-approve -input=false

            # The real bar: a second plan must find nothing to do. Anything
            # else means we echo a field differently from the way it was sent.
            # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes.
            set +e
            terraform plan -detailed-exitcode -input=false
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::$example: plan -detailed-exitcode returned $code; expected 0 (no changes)"
              exit 1
            fi

            terraform destroy -auto-approve -input=false
            echo "::endgroup::"
          done

      - name: Nothing left behind
        run: |
          remaining=$(curl -sf "http://localhost:4700/api/resources?cloud=azure" \
            | grep -o '"type":"[^"]*"' | grep -v 'Microsoft.Resources/subscriptions' || true)
          if [ -n "$remaining" ]; then
            echo "::error::destroy left resources behind:"
            echo "$remaining"
            exit 1
          fi
