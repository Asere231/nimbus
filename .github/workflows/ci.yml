name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are kept on their CURRENT major, and all of them move together.
# Every one of these had a major whose only real content was "runs on Node 24
# now": GitHub deprecated the Node 20 runtime and began forcing those actions
# onto 24 anyway, which is a warning on every job today and a hard failure
# whenever the forcing stops. Nothing here uses setup-terraform's output
# wrapper (`terraform_wrapper: false` throughout), so its majors cost us
# nothing either. The one to watch when bumping is setup-go: v6 changed
# toolchain selection, and the minimum-go job below would still PASS while
# quietly testing a newer Go than GO_MIN_VERSION -- so check the version it
# prints, not just the tick.

env:
  # The toolchain CI actually tests with. NOT pinned to go.mod's `go` directive:
  # Go 1.22's Mach-O linker omits LC_UUID, and macOS 26's dyld refuses to load
  # such binaries ("missing LC_UUID load command", then abort trap), so every
  # test binary dies before running. Unrelated to Nimbus -- it hits any Go 1.22
  # build on current macOS. The go.mod floor is covered by the minimum-go job.
  GO_VERSION: "stable"
  # The `go` directive in go.mod: the oldest toolchain we claim to support.
  GO_MIN_VERSION: "1.22"
  # Every Terraform example, applied/planned/destroyed by the terraform job.
  # Add new ones here.
  EXAMPLES: "azure-basic azure-storage aws-basic gcp-basic"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # stdlib-only, so there is no go.sum

      # gofmt runs on all three legs. It used to be Linux-only, because a
      # Windows checkout with core.autocrlf=true got CRLF and gofmt then
      # reported every file; .gitattributes pins the working tree to LF
      # everywhere, so there is nothing left to skip. `shell: bash` because
      # the Windows runner's default shell is PowerShell, which does not
      # speak $(...).
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The race detector, on Linux only: it roughly doubles the run time,
      # and one platform is enough to catch a shared-memory bug.
      #
      # Added in Milestone 11, after `go test -race` found TWO real races
      # that plain `go test` passes straight through -- both the same shape,
      # a long-running operation finished by a background goroutine while a
      # poll serialises it. One had shipped in Milestone 10. Neither was a
      # flake: the detector reports them every time, and nothing else does.
      - name: go test -race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: build
        run: go build -o bin/nimbus ./cmd/nimbus

      # The main module must stay stdlib-only (see CLAUDE.md). Check at module
      # level: `go list -deps` also reports the stdlib's own vendored
      # golang.org/x/... packages, which are not dependencies of ours.
      - name: no third-party dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          mods=$(go list -m all | grep -v '^github.com/Asere231/nimbus$' || true)
          if [ -n "$mods" ]; then
            echo "The main module must be stdlib-only, but it requires:"
            echo "$mods"
            exit 1
          fi

  # The language level in go.mod must keep compiling on the oldest toolchain we
  # claim to support. Linux only: see the GO_VERSION comment above for why 1.22
  # cannot run its own test binaries on current macOS.
  minimum-go:
    name: oldest supported Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_MIN_VERSION }}
          cache-dependency-path: go.mod
      - run: go build ./...
      - run: go test ./...

  visualizer:
    name: visualizer (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The visualizer has no build step and no dependencies, so there is
      # nothing to install: node's own test runner runs the modules straight
      # from internal/ui/static. The Go side checks that every import in
      # those modules resolves (TestEveryModuleImportResolves).
      #
      # No package.json anywhere in the repo, so node decides these .js files
      # are ES modules by reading them -- syntax detection, on by default
      # since 22.7. Hence a pinned major rather than whatever is oldest.
      #
      # The argument is a GLOB, not a directory. `node --test test/ui/` works
      # on node 26 and fails on 24 with "Cannot find module .../test/ui": the
      # runner resolved the directory as a module to load rather than a place
      # to look for tests. The glob behaves the same on both.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test 'test/ui/*.test.js'

  specgen:
    name: spec generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/specgen/go.mod
      # The generator's own tests run against the fixtures under testdata and
      # need no network. Regenerating would, so it is not done here: the
      # generated table is committed and reviewed like any other code.
      - name: Test the generator
        working-directory: tools/specgen
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  bicep:
    name: bicep deployment (az)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # The az CLI is preinstalled on GitHub's Ubuntu runners.
      - name: Register Nimbus as a cloud and sign in
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          ./bin/nimbus az register --run
          az login --service-principal \
            -u 00000000-0000-0000-0000-000000000002 -p nimbus \
            --tenant 00000000-0000-0000-0000-000000000001 --allow-no-subscriptions

      - name: az group create / vnet create / resource list
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az group create -n rg-ci -l eastus
          az network vnet create -g rg-ci -n vnet-ci --address-prefixes 10.0.0.0/16
          az resource list -g rg-ci -o table

      # Deploys the committed ARM JSON, which is exactly what az sends after
      # compiling the .bicep locally. Installing the Bicep compiler would need
      # another download, and the compiled output is what Nimbus must handle.
      - name: Deploy the Bicep example
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az deployment group create -g rg-ci -n ci-example \
            --template-file examples/bicep/main.json -o json > deployment.json
          cat deployment.json
          state=$(python3 -c "import json;print(json.load(open('deployment.json'))['properties']['provisioningState'])")
          [ "$state" = "Succeeded" ] || { echo "provisioningState=$state"; exit 1; }

      - name: The resources it created are really there
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az network vnet show -g rg-ci -n nimbus-vnet -o json > vnet.json
          subnets=$(python3 -c "import json;print(len(json.load(open('vnet.json'))['subnets']))")
          [ "$subnets" = "2" ] || { echo "the copy loop produced $subnets subnets"; exit 1; }
          az deployment group what-if -g rg-ci -n ci-example \
            --template-file examples/bicep/main.json --no-pretty-print

      - name: Deploying it again changes nothing
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          az network vnet show -g rg-ci -n nimbus-vnet -o json > before.json
          az deployment group create -g rg-ci -n ci-example-2 \
            --template-file examples/bicep/main.json -o none
          az network vnet show -g rg-ci -n nimbus-vnet -o json > after.json
          diff before.json after.json || { echo "a redeploy changed the VNet"; exit 1; }

  # Key Vault's CRYPTOGRAPHY half, driven by Terraform and then by az.
  #
  # Both clients, because they found different bugs. azurerm exercises the
  # resources; `az` exercises the operations, and three things it caught were
  # invisible to Terraform: a key LIST entry keeps `kid` flat where a bundle
  # nests the JWK under `key` (azurerm never lists keys), a certificate create
  # must answer 202 and not 200 (azurerm tolerates 200), and the sign/verify
  # round trip itself, which azurerm never performs.
  # GCP runs code: Cloud Functions Gen 2, driven by Terraform and then by
  # gcloud.
  #
  # Both clients, because gcloud needed FOUR endpoints the provider never asks
  # for -- a runtime catalogue, an upload URL, and two pre-flight APIs that
  # otherwise reach the real Google. "The provider applies cleanly" is not the
  # same claim as "the service works".
  gcp-functions:
    name: terraform gcp-functions (Cloud Functions + gcloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: The base image, pre-pulled
        run: |
          # Pre-pulled so `docker build` never reaches a registry, which is
          # the one thing this project will not do at deploy time.
          docker pull python:3.11-slim

      - name: Vendor the function's dependencies
        working-directory: examples/terraform/gcp-functions
        run: |
          set -euo pipefail
          # A Cloud Function's source carries its own dependencies here.
          # Real Cloud Functions installs requirements.txt during a REMOTE
          # BUILD, and a remote build is the one thing an offline emulator
          # cannot have -- so the archive has to bring the Functions
          # Framework, exactly as the azure-functions example brings
          # azure-functions.
          pip install --target src -r src/requirements.txt
          # The console script is present and UNUSABLE: its shebang is the
          # absolute path of the interpreter that ran pip, so in the
          # container it fails with "no such file or directory" naming a
          # script that exists. The Dockerfile runs `python -m` instead;
          # this asserts the module is importable, which is what that needs.
          test -f src/functions_framework/__main__.py

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --clouds gcp &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: Apply, curl the function, and plan clean
        working-directory: examples/terraform/gcp-functions
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          URL=$(terraform output -raw function_url)
          body=$(curl -sf "$URL?name=ci")
          echo "$body"
          # The handler's own output, so the real Functions Framework out of
          # the archive is what served it.
          echo "$body" | grep -q "hello ci from a cloud function"
          # PORT comes from the engine and FUNCTION_TARGET from
          # buildConfig.entryPoint; a handler reads both.
          echo "$body" | grep -q '"port": "8080"'
          echo "$body" | grep -q '"target": "hello"'

          # The handler's print() reaches the container console.
          docker logs "$(docker ps --filter label=nimbus.service=nimbus-hello -q)" 2>&1 | grep -q "hello called for ci"

          # Clean, or a derived value is changing between reads.
          terraform plan -detailed-exitcode -input=false

      # gcloud is preinstalled on GitHub's Ubuntu runners.
      - name: gcloud functions deploy, list and delete
        run: |
          set -euo pipefail
          ./bin/nimbus gcp register --run
          cd examples/terraform/gcp-functions

          # --quiet, and NOT `yes n |` or --no-allow-unauthenticated. Two
          # traps, both measured here.
          #
          # `yes n | cmd` under `set -o pipefail` ALWAYS reports failure,
          # because `yes` is killed by SIGPIPE the moment cmd exits: the
          # deploy succeeded and the step failed anyway, with the deploy's own
          # happy output printed by the error branch as the evidence.
          #
          # And --no-allow-unauthenticated is not the same as declining the
          # prompt. The explicit flag makes gcloud RECONCILE the backing
          # Cloud Run service's IAM -- GET .../services/{n}:getIamPolicy on
          # the v1 run endpoint, which Nimbus does not serve -- while
          # declining skips IAM entirely. --quiet defaults the prompt to no
          # and asks for no policy.
          gcloud functions deploy nimbus-gcloud --gen2 --runtime=python311 \
            --region=us-central1 --source=src --entry-point=hello --trigger-http \
            --quiet --log-http > /tmp/gcloud.log 2>&1 || { tail -40 /tmp/gcloud.log; exit 1; }

          # NOTHING may reach the real Google. Without the serviceusage and
          # cloudbuild overrides, gcloud made four requests to
          # googleapis.com in the middle of a local deploy and came back 403
          # and 401 -- so this is the assertion that keeps them wired.
          #
          # The HOST of each request, not the log as a whole, and two reasons
          # why. --log-http writes gzipped response bodies, so the file is
          # BINARY and a plain grep over it is unreliable (hence -a). And a
          # request PATH legitimately contains googleapis.com: asking Service
          # Usage about run.googleapis.com puts the service's name in the URL,
          # so grepping the uri line matches three times while every request
          # went to localhost. Checking the host is the only form that means
          # what it says.
          hosts=$(grep -a '^uri:' /tmp/gcloud.log | sed 's|^uri: https*://||; s|/.*||' | sort -u)
          echo "hosts gcloud talked to:"; echo "$hosts"
          if echo "$hosts" | grep -q 'googleapis.com'; then
            echo "FAIL: gcloud reached the real Google"
            exit 1
          fi
          test -n "$hosts"

          gcloud functions describe nimbus-gcloud --region=us-central1 --gen2 \
            --format="value(state)" | grep -q ACTIVE
          # The gcloud-deployed function really answers.
          curl -sf "http://localhost:4703/_nimbus/functions/nimbus-gcloud" | grep -q "cloud function"

          # A clean listing: gcloud reads the v1 and v2 lists and merges
          # them, so a 404 on the Gen 1 list printed an error beside a
          # listing that had worked.
          gcloud functions list > /tmp/list.log 2>&1
          cat /tmp/list.log
          grep -q nimbus-gcloud /tmp/list.log
          if grep -qi "error" /tmp/list.log; then
            echo "FAIL: functions list printed an error beside a successful listing"; exit 1
          fi

          gcloud functions runtimes list --region=us-central1 | grep -q python311
          gcloud functions delete nimbus-gcloud --region=us-central1 --gen2 --quiet

      - name: Destroy, and leave no container and no image
        working-directory: examples/terraform/gcp-functions
        run: |
          set -euo pipefail
          terraform destroy -auto-approve -input=false
          sleep 2
          left=$(docker ps -aq --filter name=nimbus-gcf | wc -l | tr -d ' ')
          imgs=$(docker images -q --filter 'reference=nimbus-gcf-*' | wc -l | tr -d ' ')
          echo "containers: $left  images: $imgs"
          # The image is the quiet one: nothing in `docker ps` shows it, and
          # a destroy AFTER A RESTART left one behind until the plugin began
          # removing it by its derived tag.
          test "$left" = "0"
          test "$imgs" = "0"

  keyvault:
    name: terraform azure-keyvault (keys, certs, az crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: Apply the example
        working-directory: examples/terraform/azure-keyvault
        env:
          # Go on Linux honours SSL_CERT_FILE; azurerm inherits it.
          SSL_CERT_FILE: /home/runner/.nimbus/certs/nimbus-ca.pem
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false
          # Clean, because a key's JWK or a certificate's policy that differed
          # between reads would be a permanent diff.
          terraform plan -detailed-exitcode -input=false

      # The az CLI is preinstalled on GitHub's Ubuntu runners.
      - name: Register Nimbus as a cloud and sign in
        run: |
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          ./bin/nimbus az register --run
          az login --service-principal \
            -u 00000000-0000-0000-0000-000000000002 -p nimbus \
            --tenant 00000000-0000-0000-0000-000000000001 --allow-no-subscriptions

      - name: The vault signs, and the private half never leaves
        run: |
          set -euo pipefail
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          V=kv-nimbus-demo

          # A key LIST must work. It is a different shape from a bundle --
          # `kid` flat rather than a nested `key` -- and returning the bundle
          # shape made this fail with "'None' is not a valid ID".
          az keyvault key list --vault-name $V --query "[].kid" -o tsv | tee /tmp/keys.txt
          grep -q "signing-key" /tmp/keys.txt
          grep -q "ec-key" /tmp/keys.txt

          # NO private material, anywhere in a key read. The nulls az prints
          # for p/q/qi are its own SDK struct fields, not fields Nimbus sent,
          # so the check is on the RAW response rather than az's rendering.
          curl -sf --cacert "$REQUESTS_CA_BUNDLE" \
            -H "Authorization: Bearer x" \
            "https://$V.vault.nimbus.localhost:4701/keys/signing-key?api-version=7.4" > /tmp/key.json
          cat /tmp/key.json
          for member in '"d"' '"p"' '"q"' '"dp"' '"dq"' '"qi"'; do
            if grep -q "$member" /tmp/key.json; then
              echo "FAIL: the key response carries the private JWK member $member"; exit 1
            fi
          done

          # Sign, then verify. The digest is STANDARD base64 WITH padding: az
          # decodes it client-side and re-encodes for the wire, so stripping
          # the padding fails inside az with "Incorrect padding" before a
          # request is sent. The fields are `signature` and `isValid`.
          D=$(printf 'hello' | openssl dgst -sha256 -binary | openssl base64 -A)
          S=$(az keyvault key sign --vault-name $V --name signing-key \
                --algorithm RS256 --digest "$D" --query signature -o tsv)
          test -n "$S"
          ok=$(az keyvault key verify --vault-name $V --name signing-key \
                 --algorithm RS256 --digest "$D" --signature "$S" --query isValid -o tsv)
          test "$ok" = "true"

          # An EC key cannot encrypt, and the refusal says why rather than no.
          set +e
          out=$(az keyvault key encrypt --vault-name $V --name ec-key \
                  --algorithm RSA-OAEP-256 --value "aGk=" 2>&1)
          set -e
          echo "$out" | grep -q "do not encrypt"

      - name: A certificate is three objects under one name
        run: |
          set -euo pipefail
          export REQUESTS_CA_BUNDLE="$HOME/.nimbus/certs/nimbus-ca.pem"
          V=kv-nimbus-demo

          az keyvault certificate show --vault-name $V --name web \
            --query "{cert:id, key:kid, secret:sid}" -o json | tee /tmp/cert.json
          # kid and sid must be VERSIONED: azurerm fails the apply with
          # "expected a versioned ID" otherwise, after creating the thing --
          # an error naming neither the field nor the resource. A versioned id
          # is .../{collection}/{name}/{version}, so it has one more path
          # segment than an unversioned one.
          # A `case` inside $(...) does not work here: the ")" of a pattern
          # closes the command substitution. Pairs instead.
          for pair in certificate:id key:kid secret:sid; do
            field=${pair%%:*}
            id=$(az keyvault certificate show --vault-name $V --name web \
                   --query "${pair##*:}" -o tsv)
            segs=$(printf '%s' "$id" | tr -cd '/' | wc -c | tr -d ' ')
            if [ "$segs" -lt 5 ]; then
              echo "FAIL: the $field id is not versioned: $id"; exit 1
            fi
            echo "ok   $field -> $id"
          done
          # The key and the secret really exist under the same name.
          az keyvault key show --vault-name $V --name web --query key.kid -o tsv
          # PEM, not the PKCS#12 the policy asked for: the Go standard library
          # has no PKCS#12 encoder, so the content type says what it is.
          test "$(az keyvault secret show --vault-name $V --name web --query contentType -o tsv)" = "application/x-pem-file"

          # Deleting the certificate takes its key and its secret with it.
          az keyvault certificate delete --vault-name $V --name web -o none
          set +e
          az keyvault key show --vault-name $V --name web -o none 2>/dev/null
          test $? -ne 0 || { echo "FAIL: the key outlived its certificate"; exit 1; }
          set -e
          echo "the key went with the certificate"

      - name: Destroy
        working-directory: examples/terraform/azure-keyvault
        env:
          SSL_CERT_FILE: /home/runner/.nimbus/certs/nimbus-ca.pem
        run: terraform destroy -auto-approve -input=false

  sdkcompat:
    name: go-azure-sdk harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/sdkcompat/go.sum

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start &
          # Wait for the visualizer rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: Run the SDK compatibility harness
        working-directory: test/sdkcompat
        # Unlike macOS, Go on Linux honours SSL_CERT_FILE, so the CA does not
        # need installing into a system trust store.
        run: |
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          go run . -endpoint https://localhost:4701

  storage-sdk:
    name: Azure SDK for Python harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/storage-sdk/requirements.txt

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # The harness needs an account to exist; the example is how one is made.
      - name: Create a storage account
        working-directory: examples/terraform/azure-storage
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Drive blob, queue and table with the Python SDKs
        working-directory: test/storage-sdk
        run: ./run.sh stnimbusdata

      # A SAS decides, and the REASON is the point.
      #
      # Every token here is generated by the PROVIDER, client-side, from the
      # account key -- nothing tells Nimbus what a token says, it works it out
      # from the signature as Azure does. Which is also what makes this the
      # drift guard on the string-to-sign layouts: azurerm emits sv=2018-11-09
      # for a container SAS and sv=2022-11-02 for an account SAS, neither of
      # them the sv=2026-04-06 `az` sends, and the three do not all use the
      # same number of fields. If a provider upgrade starts emitting a version
      # whose layout is not implemented, probe 1 stops returning 200 and this
      # step says so.
      #
      # The statuses are asserted AND the messages are, because a refusal that
      # does not say why is the thing this milestone was built to replace.
      - name: azure-storage-sas, and the refusals it is for
        working-directory: examples/terraform/azure-storage-sas
        env:
          SSL_CERT_FILE: /home/runner/.nimbus/certs/nimbus-ca.pem
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          terraform output signed_versions

          CA="$HOME/.nimbus/certs/nimbus-ca.pem"
          B="$(terraform output -raw blob_endpoint)"
          RO="$(terraform output -raw read_only_sas)"

          # probe <name> <want-status> <want-substring-in-body> -- curl args...
          probe() {
            local name="$1" want="$2" needle="$3"; shift 3
            local body code
            body=$(mktemp)
            code=$(curl -s -o "$body" -w '%{http_code}' --cacert "$CA" "$@")
            if [ "$code" != "$want" ]; then
              echo "FAIL $name: HTTP $code, want $want"; cat "$body"; exit 1
            fi
            # An empty needle means "the status is the whole assertion" -- a 201
            # from a successful write has no body at all, and grep for "" on an
            # empty file exits 1, which would fail a probe that passed.
            if [ -n "$needle" ] && ! grep -qF "$needle" "$body"; then
              echo "FAIL $name: body does not contain '$needle'"; cat "$body"; exit 1
            fi
            echo "ok   $name -> $code"
          }

          # 1. the token verifies and reads. This is what proves the
          #    string-to-sign layout for whatever sv the provider emitted.
          probe "read-only SAS reads" 200 "needs a credential" "$B""private/secret.txt$RO"

          # 2. the same token cannot write, and the refusal names the letter.
          probe "read-only SAS cannot write" 403 "w (write)" \
            -X PUT -H 'x-ms-blob-type: BlockBlob' -d nope "$B""private/new.txt$RO"

          # 3. a signature whose percent-escape is broken is refused AS A SAS,
          #    not silently demoted to anonymous -- which answered 404 "the
          #    specified resource does not exist" before, explaining nothing.
          probe "unreadable signature" 403 "could not be read" \
            "$B""private/secret.txt$(printf '%s' "$RO" | sed 's/.$/X/')"

          # 4. a signature that decodes but is wrong quotes the string-to-sign,
          #    which is the single most useful thing in that error.
          probe "tampered signature" 403 "string-to-sign" \
            "$B""private/secret.txt$(printf '%s' "$RO" | sed 's/sig=./sig=Z/')"

          # 5. an expired SAS says WHEN it expired.
          probe "expired SAS" 403 "expired at 2020-01-01" \
            "$B""private/secret.txt$(terraform output -raw expired_sas)"

          # 6. an account SAS for queues, used on a blob: the signature is
          #    perfectly good and ss does not name the service asked for.
          probe "account SAS for the wrong service" 403 "does not include blob" \
            "$B""private/secret.txt$(terraform output -raw queue_only_sas)"

          # 7. a full account SAS writes, proving the ACCOUNT layout verifies
          #    too -- it signs a different string of a different length.
          probe "account SAS writes" 201 "" \
            -X PUT -H 'x-ms-blob-type: BlockBlob' -d ok \
            "$B""private/via-account.txt$(terraform output -raw account_sas)"

          # 8. sip, the NEGATIVE case only. A token scoped to 127.0.0.1
          #    passes or fails depending on whether the client resolved the
          #    data-plane name to 127.0.0.1 or ::1, and the nested *.localhost
          #    names commonly give ::1 -- so asserting that one SUCCEEDS would
          #    be flaky. A token naming somebody else is refused either way.
          probe "SAS bound to another source IP" 403 "203.0.113.7" \
            "$B""private/secret.txt$(terraform output -raw wrong_ip_sas)"

          # 9-11. anonymous, which the CONTAINER decides. PublicAccess was
          #    stored and echoed for eleven milestones and read by nothing.
          probe "anonymous reads a public blob" 200 "anyone may read this one" "$B""public/notice.txt"
          probe "anonymous cannot read a private blob" 404 "does not exist" "$B""private/secret.txt"
          # The needle carries no quote marks on purpose: the body is XML, so
          # a quoted value arrives as &#34;container&#34; and a literal grep for
          # the quoted form fails on a refusal that is perfectly correct.
          probe "public access 'blob' does not allow listing" 403 "needs public access level" \
            "$B""public?restype=container&comp=list"

          # The plan must be clean: a SAS is computed from the account key, so
          # a token that differed between reads would be a permanent diff.
          terraform plan -detailed-exitcode -input=false
          terraform destroy -auto-approve -input=false

  # AKS needs Docker, so it is its own job rather than part of the matrix.
  # GitHub's Linux runners have a daemon, so this really does boot k3s.
  aks:
    name: terraform azure-aks (k3s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and k3s image
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1
          # For TestRedeployingAFunctionThatHasRunSucceeds, which deploys a
          # real function, runs it, and deploys again -- the sequence that
          # was never exercised anywhere and where /var/task being writable
          # left root-owned bytecode the next deploy could not remove.
          docker pull public.ecr.aws/lambda/python:3.12
          docker pull alpine:3.20

      - name: Engine tests against a real daemon
        run: |
          set -euo pipefail
          # -v into a file, because a SKIPPED test passes and `go test`
          # without -v says nothing about it. These tests exist to prove a
          # REAL daemon behaves as the Fake claims, and each one skips
          # ITSELF when NIMBUS_DOCKER_TESTS is unset or the daemon is
          # unreachable -- so a typo in this step's environment, or a
          # daemon that quietly went away, would leave the job green with
          # nothing whatsoever to read.
          #
          # Measured, which is why this exists: adding two real-container
          # tests moved this package from 15.554s to 16.369s, and +0.8s is
          # not evidence either way. Asking for them by name is.
          LOG=/tmp/engines.log
          NIMBUS_DOCKER_TESTS=1 go test ./internal/engines/... -count=1 -v > "$LOG" 2>&1 || { tail -100 "$LOG"; exit 1; }
          REAL='TestARealContainerResolvesAnAliasToTheHost TestARealContainerCanReadTheMountedCA TestARealInstanceBootsRunsUserDataAndStaysUp TestRedeployingAFunctionThatHasRunSucceeds'
          echo 'the real-daemon tests ran:'
          for t in $REAL; do
            # Printed from the SAME grep that verifies it, so the console
            # shows exactly what was checked. A separate summary grep used
            # to do this and matched only names beginning TestAReal, so a
            # test outside that prefix was verified and then left out of
            # the evidence -- green for the right reason, reported on the
            # wrong one, which is the gap this whole step exists to close.
            line=$(grep -- "--- PASS: $t" "$LOG" || true)
            if [ -z "$line" ]; then
              echo "::error::$t did not PASS -- skipped, or it never ran"
              grep -- "$t" "$LOG" || echo '(the name appears nowhere)'
              exit 1
            fi
            echo "$line"
          done

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, kubectl, scale, destroy
        working-directory: examples/terraform/azure-aks
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The cluster must be a real one, not just an ARM record.
          # `wait --all` errors immediately when nothing matches, so check the
          # nodes exist before waiting on their condition.
          kubectl --kubeconfig ./kubeconfig get nodes
          kubectl --kubeconfig ./kubeconfig wait --for=condition=Ready node --all --timeout=300s

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # node_count is real: scaling must add a node.
          terraform apply -auto-approve -input=false -var node_count=3
          for i in $(seq 1 40); do
            n=$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)
            [ "$n" -ge 3 ] && break
            sleep 5
          done
          kubectl --kubeconfig ./kubeconfig get nodes
          [ "$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)" -ge 3 ] || {
            echo "::error::scaling to node_count=3 did not add a node"; exit 1; }

          terraform destroy -auto-approve -input=false -var node_count=3

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.cluster)
          if [ -n "$left" ]; then
            echo "::error::destroy left containers running:"
            docker ps -a --filter label=nimbus.cluster
            exit 1
          fi

  # The milestone 4 example: a registry, a vault and a cluster together. Needs
  # Docker for both the registry and k3s, so it joins the aks job's shape
  # rather than the plain terraform matrix.
  app:
    name: terraform azure-app (ACR + Key Vault + AKS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and images
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1
          docker pull registry:2
          docker pull nginx:alpine

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --persist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, pull from the local registry, read the secret
        working-directory: examples/terraform/azure-app
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The pod has to actually start, which means containerd really did
          # pull the image through the cluster's mirror of our registry.
          kubectl --kubeconfig ./kubeconfig get pods
          kubectl --kubeconfig ./kubeconfig rollout status deploy/app --timeout=300s

          # And the secret really came from the Key Vault data plane.
          got=$(kubectl --kubeconfig ./kubeconfig exec deploy/app -- printenv DB_PASSWORD)
          [ "$got" = "hunter2" ] || { echo "::error::DB_PASSWORD was \"$got\""; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

          # Destroy purges the vault, so the same name is free again. Applying
          # just the vault proves it without booting a second cluster.
          terraform apply -auto-approve -input=false -target=azurerm_key_vault.app
          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          # One filter per label: docker ANDs repeated label filters, so asking
          # for both at once would match nothing and always pass.
          for label in nimbus.cluster nimbus.registry; do
            left=$(docker ps -aq --filter "label=$label")
            if [ -n "$left" ]; then
              echo "::error::destroy left $label containers running:"
              docker ps -a --filter "label=$label"
              exit 1
            fi
          done

  # Milestone 11's instance example. An instance is a container, so this
  # needs Docker and sits with the other engine-backed jobs rather than in
  # the plain terraform matrix.
  ec2-instance:
    name: terraform aws-instance (EC2 on the vm engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the instance base image
        run: |
          docker version --format '{{.Server.Version}}'
          # Pulled here so the apply's own timeout is not spent on a
          # download. Alpine because it is tiny and its busybox has the
          # base64 and tee the engine's bootstrap needs.
          docker pull alpine:3.20

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds aws &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, shell in, stop/start, destroy
        working-directory: examples/terraform/aws-instance
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          E="--endpoint-url http://localhost:4702"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          id=$(terraform output -raw instance_id)

          # The instance really booted and really ran its user data. The
          # third line proves the metadata service too: the script read its
          # own instance id back out of it.
          # "The apply returned" does not mean the boot script has FINISHED
          # -- no cloud promises that. Wait for the line being asserted on,
          # which is a definite signal rather than a timing guess. The
          # azure-vm job read this log 40ms after an apply and found no
          # file at all, which is how the distinction got noticed; these
          # two had the same race and had only been winning it.
          for i in $(seq 1 60); do
            ../../../bin/nimbus ssh web -- cat /var/log/nimbus-boot.log \
              > /tmp/bootlog.txt 2>/dev/null || true
            if grep -q "instance-id: $id" /tmp/bootlog.txt; then break; fi
            sleep 1
          done
          cat /tmp/bootlog.txt
          grep -q "instance-id: $id" /tmp/bootlog.txt || {
            echo "::error::the instance could not read its own metadata"; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # Stopping and starting must keep the root filesystem: the file
          # the boot script wrote has to still be there afterwards. That is
          # the difference between docker start and a fresh container.
          aws $E ec2 stop-instances --instance-ids "$id" >/dev/null
          for i in $(seq 1 30); do
            st=$(aws $E ec2 describe-instances --instance-ids "$id"               --query 'Reservations[0].Instances[0].State.Name' --output text)
            [ "$st" = "stopped" ] && break
            sleep 2
          done
          [ "$st" = "stopped" ] || { echo "::error::the instance is $st, not stopped"; exit 1; }

          aws $E ec2 start-instances --instance-ids "$id" >/dev/null
          for i in $(seq 1 30); do
            st=$(aws $E ec2 describe-instances --instance-ids "$id"               --query 'Reservations[0].Instances[0].State.Name' --output text)
            [ "$st" = "running" ] && break
            sleep 2
          done
          [ "$st" = "running" ] || { echo "::error::the instance is $st, not running"; exit 1; }

          ../../../bin/nimbus ssh web -- cat /var/log/nimbus-boot.log >/dev/null || {
            echo "::error::the root filesystem did not survive a stop/start"; exit 1; }

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.role=instance)
          if [ -n "$left" ]; then
            echo "::error::destroy left instance containers running:"
            docker ps -a --filter label=nimbus.role=instance
            exit 1
          fi

  # Milestone 11's Azure VM example. Needs the CA trusted, like the other
  # azurerm jobs, because azurerm talks to Nimbus over TLS.
  azure-vm:
    name: terraform azure-vm (VM on the vm engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the VM base image
        run: |
          docker version --format '{{.Server.Version}}'
          # ubuntu:24.04, because that is what Canonical/ubuntu-24_04-lts
          # maps to: an Azure image reference is a publisher/offer/sku
          # triple that says what it is, unlike an opaque AMI id.
          docker pull ubuntu:24.04

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds azure &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, shell in, destroy
        working-directory: examples/terraform/azure-vm
        run: |
          set -euo pipefail
          # Go on Linux honours SSL_CERT_FILE, so the CA does not have to be
          # installed into the system store -- the same line the other
          # azurerm jobs use.
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The machine is up the moment the apply returns, because the VM
          # provisions asynchronously and azurerm waits for it. With the
          # work in AfterPut instead, the apply finished while the image
          # was still being pulled.
          #
          # But "up" does not mean its boot script has FINISHED -- no cloud
          # promises that, and blocking an apply on someone's apt-get would
          # be its own bug. So wait for the console marker, which is a
          # definite signal, before asserting on what the script printed.
          # This step read the log 40ms after an apply and found no file at
          # all, which is how that distinction got noticed.
          for i in $(seq 1 60); do
            ../../../bin/nimbus ssh vm-nimbus -- cat /var/log/nimbus-boot.log \
              > /tmp/bootlog.txt 2>/dev/null || true
            if grep -q "size from the environment" /tmp/bootlog.txt; then break; fi
            sleep 1
          done
          cat /tmp/bootlog.txt
          grep -q "apt is present: /usr/bin/apt-get" /tmp/bootlog.txt || {
            echo "::error::the custom data did not run in a real ubuntu"; exit 1; }
          grep -q "size from the environment: Standard_B1s" /tmp/bootlog.txt || {
            echo "::error::the machine was not told its own size"; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.role=instance)
          if [ -n "$left" ]; then
            echo "::error::destroy left instance containers running:"
            docker ps -a --filter label=nimbus.role=instance
            exit 1
          fi

  # Milestone 11's GCE example, beside the EC2 one.
  gce-instance:
    name: terraform gcp-instance (GCE on the vm engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the instance base image
        run: |
          docker version --format '{{.Server.Version}}'
          # debian:12, because that is what debian-cloud/debian-12 maps to:
          # a GCE image name says what it is, unlike an opaque AMI id.
          docker pull debian:12

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds gcp &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, shell in, stop/start, destroy
        working-directory: examples/terraform/gcp-instance
        run: |
          set -euo pipefail
          B=http://localhost:4703/compute/v1/projects/nimbus-local/zones/us-central1-a/instances/web
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The startup script really ran, in a real Debian.
          # "The apply returned" does not mean the boot script has FINISHED
          # -- no cloud promises that. Wait for the line being asserted on,
          # which is a definite signal rather than a timing guess. The
          # azure-vm job read this log 40ms after an apply and found no
          # file at all, which is how the distinction got noticed; these
          # two had the same race and had only been winning it.
          for i in $(seq 1 60); do
            ../../../bin/nimbus ssh web -- cat /var/log/nimbus-boot.log \
              > /tmp/bootlog.txt 2>/dev/null || true
            if grep -q "apt is present" /tmp/bootlog.txt; then break; fi
            sleep 1
          done
          cat /tmp/bootlog.txt
          grep -q "apt is present: /usr/bin/apt-get" /tmp/bootlog.txt || {
            echo "::error::the startup script did not run in a real debian"; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # stop and start are TRAILING PATH SEGMENTS, not colon verbs, and
          # GCE calls a stopped instance TERMINATED -- the same word EC2
          # uses for one that has been destroyed.
          curl -sf -X POST "$B/stop" >/dev/null
          for i in $(seq 1 30); do
            st=$(curl -sf "$B" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            [ "$st" = "TERMINATED" ] && break
            sleep 2
          done
          [ "$st" = "TERMINATED" ] || { echo "::error::the instance is $st, not TERMINATED"; exit 1; }

          curl -sf -X POST "$B/start" >/dev/null
          for i in $(seq 1 30); do
            st=$(curl -sf "$B" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            [ "$st" = "RUNNING" ] && break
            sleep 2
          done
          [ "$st" = "RUNNING" ] || { echo "::error::the instance is $st, not RUNNING"; exit 1; }

          # The root filesystem has to survive that.
          ../../../bin/nimbus ssh web -- cat /var/log/nimbus-boot.log >/dev/null || {
            echo "::error::the root filesystem did not survive a stop/start"; exit 1; }

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.role=instance)
          if [ -n "$left" ]; then
            echo "::error::destroy left instance containers running:"
            docker ps -a --filter label=nimbus.role=instance
            exit 1
          fi

  # Milestone 8's two examples. Both need Docker -- a Lambda is a container
  # and an EKS cluster is k3s -- so they sit beside the AKS job rather than
  # in the plain terraform matrix.
  serverless:
    name: terraform aws-serverless (Lambda + DynamoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the Lambda base image
        run: |
          docker version --format '{{.Server.Version}}'
          # The image carries the Runtime Interface Emulator, which is what
          # runs the handler. Pulled here so the apply's own timeout is not
          # spent on a download.
          docker pull public.ecr.aws/lambda/python:3.12

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds aws &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, invoke, scan, destroy
        working-directory: examples/terraform/aws-serverless
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          E="--endpoint-url http://localhost:4702"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # The handler must really run, and reach DynamoDB through
          # AWS_ENDPOINT_URL with no endpoint in its own code.
          #
          # The payload goes through fileb:// because the two aws-cli major
          # versions disagree about an inline one, and there is no inline
          # spelling that both accept. v2 -- what the runners ship -- reads
          # --payload as base64 and fails with `Invalid base64: "{"id":...`,
          # wanting --cli-binary-format raw-in-base64-out; v1, which this
          # project was measured against, takes the JSON raw and rejects
          # that flag outright as an unknown option. fileb:// means "these
          # bytes, verbatim" to BOTH, so it is the one portable form.
          printf '{"id":"ci","note":"from CI"}' > payload.json
          aws $E lambda invoke --function-name nimbus-writer \
            --payload fileb://payload.json out.json
          cat out.json
          grep -q '"written": "ci"' out.json || {
            echo "::error::the handler did not return what it should"; exit 1; }

          items=$(aws $E dynamodb scan --table-name nimbus-items --query 'Count' --output text)
          # Exactly one: the readiness probe must not have invoked the
          # handler, which it used to and which wrote a phantom item.
          if [ "$items" != "1" ]; then
            echo "::error::the table holds $items items, expected exactly 1"
            aws $E dynamodb scan --table-name nimbus-items
            exit 1
          fi

          # What the handler printed has to be in its log group.
          aws $E logs filter-log-events --log-group-name /aws/lambda/nimbus-writer \
            --query 'events[].message' --output text | tee logs.txt
          grep -q "wrote ci to nimbus-items" logs.txt || {
            echo "::error::the handler's output is not in its log group"; exit 1; }

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.function)
          if [ -n "$left" ]; then
            echo "::error::destroy left function containers running:"
            docker ps -a --filter label=nimbus.function
            exit 1
          fi

  url-shortener:
    name: terraform url-shortener (the app, five services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the Lambda base image
        run: docker pull public.ecr.aws/lambda/python:3.12

      - name: Start Nimbus with --persist
        run: |
          set -euo pipefail
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # This is the only job that drives several services AGAINST EACH OTHER
      # rather than one service family at a time, which is what the example
      # exists for: building it turned up three bugs in an afternoon, and
      # each of the three assertions below is one of them. None could have
      # been caught by a single-service example.
      - name: apply, drive the app, RESTART, destroy
        working-directory: examples/apps/url-shortener
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          E="--endpoint-url http://localhost:4702"

          # Not named `go`: a shell function by that name would shadow the
          # Go toolchain for the rest of the step.
          invoke() {
            printf '%s' "$1" > payload.json
            aws $E lambda invoke --function-name shortener \
              --payload fileb://payload.json out.json >/dev/null
            cat out.json
          }
          plan_is_clean() {
            set +e; terraform plan -detailed-exitcode -input=false; local c=$?; set -e
            if [ "$c" -ne 0 ]; then
              echo "::error::$1: plan -detailed-exitcode returned $c, expected 0"
              return 1
            fi
          }

          terraform init -input=false
          terraform apply -auto-approve -input=false

          # BUG 1: CloudWatch Logs tags were accepted and discarded, under a
          # comment saying they were "never read back by anything that
          # matters". The provider reads them on every refresh, so a log
          # group with a tags block applied cleanly and then wanted the same
          # change on every later plan, for ever.
          plan_is_clean "after the first apply"

          # The app itself, through the Lambda, reaching DynamoDB and S3 with
          # no endpoint in the handler's own code.
          first=$(invoke '{"action":"create","url":"https://go.dev","owner":"ci"}')
          echo "$first"
          short=$(echo "$first" | jq -r .code)
          [ "$(echo "$first" | jq -r .created)" = "true" ] || {
            echo "::error::the first create did not create anything"; exit 1; }

          # A conditional write: the same url must not be stored twice.
          again=$(invoke '{"action":"create","url":"https://go.dev","owner":"ci"}')
          echo "$again"
          [ "$(echo "$again" | jq -r .created)" = "false" ] || {
            echo "::error::ConditionExpression did not refuse the second create"; exit 1; }
          [ "$(echo "$again" | jq -r .code)" = "$short" ] || {
            echo "::error::the same url shortened to a different code"; exit 1; }

          invoke '{"action":"create","url":"https://terraform.io","owner":"ci"}' >/dev/null

          # An atomic counter: ADD, not get-then-put.
          invoke "{\"action\":\"resolve\",\"code\":\"$short\"}" >/dev/null
          hits=$(invoke "{\"action\":\"resolve\",\"code\":\"$short\"}" | jq -r .hits)
          [ "$hits" = "2" ] || {
            echo "::error::the hit counter reads $hits after two resolves, expected 2"; exit 1; }

          # A query against a secondary index, newest first.
          listed=$(invoke '{"action":"list","owner":"ci"}')
          echo "$listed"
          [ "$(echo "$listed" | jq -r .count)" = "2" ] || {
            echo "::error::the by-owner index returned $(echo "$listed" | jq -r .count) links, expected 2"
            exit 1; }

          # And S3, written by the handler and read back by the CLI.
          invoke '{"action":"publish","owner":"ci"}'
          aws $E s3 cp s3://shortener-assets/pages/ci/index.html page.html
          grep -q "$short" page.html || {
            echo "::error::the published page does not mention the link it should"
            cat page.html; exit 1; }

          aws $E logs filter-log-events --log-group-name /aws/lambda/shortener \
            --query 'events[].message' --output text | tee logs.txt
          grep -q "created $short" logs.txt || {
            echo "::error::the handler's own output is not in its log group"; exit 1; }

          # BUG 2: a log group did not survive a restart. Its existence lived
          # both in the store, which persists, and in an in-memory index,
          # which is what DescribeLogGroups reads -- so Terraform reported
          # `# aws_cloudwatch_log_group.fn has been deleted` and recreated a
          # resource that was right there.
          echo "::group::restarting Nimbus"
          kill "$(cat /tmp/nimbus.pid)"
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null || break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          ./bin/nimbus start --clouds aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE/examples/apps/url-shortener"
          echo "::endgroup::"

          plan_is_clean "after the restart"

          # The whole app still works, not just the plan: the Lambda's
          # container has to have been adopted and the counter carried on.
          after=$(invoke "{\"action\":\"resolve\",\"code\":\"$short\"}")
          echo "$after"
          [ "$(echo "$after" | jq -r .hits)" = "3" ] || {
            echo "::error::the counter did not carry across the restart"; exit 1; }

          # BUG 3: a VERSIONED bucket could never be destroyed. The provider
          # empties one through ListObjectVersions, which fell through to the
          # generic empty document for an unimplemented sub-resource -- so
          # force_destroy deleted nothing and the destroy retried past ten
          # minutes. A regression therefore HANGS rather than failing, which
          # is why this one is bounded: five minutes is many times what the
          # destroy takes and far short of the job's own limit.
          timeout 300 terraform destroy -auto-approve -input=false || {
            echo "::error::destroy did not finish; a versioned bucket that cannot be emptied hangs here"
            aws $E s3api list-object-versions --bucket shortener-assets || true
            exit 1; }

          if aws $E s3api head-bucket --bucket shortener-assets 2>/dev/null; then
            echo "::error::the bucket survived the destroy"
            exit 1
          fi

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter "name=nimbus-" | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::destroy left $left nimbus container(s) behind"
            docker ps -a --filter "name=nimbus-"
            exit 1
          fi

  eks:
    name: terraform aws-eks (k3s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and k3s image
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds aws &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, kubectl through the token webhook, destroy
        working-directory: examples/terraform/aws-eks
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The kubeconfig `aws eks update-kubeconfig` writes runs
          # `aws eks get-token`, whose bearer token is built client-side --
          # so this passing means the token authentication webhook worked.
          aws --endpoint-url http://localhost:4702 eks update-kubeconfig \
            --name nimbus --kubeconfig ./kubeconfig
          # `kubectl wait --all` matches only the nodes that EXIST when it
          # runs, so on a slower runner it returns satisfied with the control
          # plane alone and never waits for the pool's agent to register --
          # which is what happened here: one Ready node, five seconds after
          # the apply. Wait for the COUNT first, the way the AKS scale step
          # already does, and only then on the condition.
          for i in $(seq 1 60); do
            n=$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers 2>/dev/null | wc -l)
            [ "$n" -ge 2 ] && break
            sleep 5
          done
          kubectl --kubeconfig ./kubeconfig wait --for=condition=Ready node --all --timeout=300s
          kubectl --kubeconfig ./kubeconfig get nodes
          [ "$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)" -ge 2 ] || {
            echo "::error::the node group did not add a node"; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.cluster)
          if [ -n "$left" ]; then
            echo "::error::destroy left containers running:"
            docker ps -a --filter label=nimbus.cluster
            exit 1
          fi

  gcp-compute:
    name: terraform gcp-gke + run/pubsub (k3s, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the images both examples need
        run: |
          docker version --format '{{.Server.Version}}'
          docker pull rancher/k3s:v1.34.12-k3s1
          docker pull python:3.12-alpine

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds gcp &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: GKE -- apply, kubectl, clean plan, destroy
        working-directory: examples/terraform/gcp-gke
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # `gcloud container clusters get-credentials` cannot work here --
          # its auth plugin needs a Google credential Nimbus has none of --
          # so this is the path CI and the docs both use.
          ../../../bin/nimbus gcp kubeconfig nimbus-gke --out kubeconfig
          # `kubectl wait --all` matches only the nodes that EXIST when it
          # runs, so on a slower runner it returns satisfied with the control
          # plane alone and never waits for the pool's agent to register --
          # which is what happened here: one Ready node, five seconds after
          # the apply. Wait for the COUNT first, the way the AKS scale step
          # already does, and only then on the condition.
          for i in $(seq 1 60); do
            n=$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers 2>/dev/null | wc -l)
            [ "$n" -ge 2 ] && break
            sleep 5
          done
          kubectl --kubeconfig ./kubeconfig wait --for=condition=Ready node --all --timeout=300s
          kubectl --kubeconfig ./kubeconfig get nodes
          [ "$(kubectl --kubeconfig ./kubeconfig get nodes --no-headers | wc -l)" -ge 2 ] || {
            echo "::error::the node pool did not add a node"; exit 1; }

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

      - name: Cloud Run + Pub/Sub -- publish a message and see it arrive
        working-directory: examples/terraform/gcp-run-pubsub
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          url=$(terraform output -raw service_url)
          [ "$(curl -s --max-time 30 "$url")" = "nimbus cloud run: ok" ] || {
            echo "::error::the Cloud Run service did not answer"; exit 1; }

          eval "$(terraform output -raw publish_with_curl)"
          sleep 5

          # The handler prints what it decoded out of the push envelope, so
          # finding this line proves the whole chain: publish, push, a real
          # container running real code.
          container=$(docker ps --filter label=nimbus.service=nimbus-echo -q)
          docker logs "$container" 2>&1 | tee /tmp/run.log
          grep -q '"hello":"world"' /tmp/run.log || {
            echo "::error::the service never received the pushed message"; exit 1; }

          terraform destroy -auto-approve -input=false

      - name: No containers left behind
        run: |
          left=$(docker ps -aq --filter label=nimbus.resource-id)
          if [ -n "$left" ]; then
            echo "::error::destroy left containers running:"
            docker ps -a --filter label=nimbus.resource-id
            exit 1
          fi

  terraform:
    name: terraform examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # so exit codes reach us unchanged

      - name: Start Nimbus
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          # Both clouds in ONE process, which is the point: they share a
          # store, a journal and a visualizer, and an example of each
          # running side by side is the real test that they still do.
          ./bin/nimbus start --clouds azure,aws,gcp &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, plan, destroy
        working-directory: examples/terraform
        run: |
          set -euo pipefail
          # Go on Linux honours SSL_CERT_FILE; the azurerm provider inherits it.
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"

          # Every example, not just the first. azure-storage exercises the
          # data plane -- Shared Key, XML, real bytes -- which shares the ARM
          # write path with everything else, so it is the example most likely
          # to catch collateral damage from an unrelated change. aws-basic
          # covers the other cloud entirely: SigV4 routing, EC2 Query/XML, S3
          # REST and IAM, and gcp-basic the third -- Compute's operations,
          # IAM service accounts and a Cloud Storage object with real bytes.
          # All three clouds against the same running server, which is the
          # point: they share a store, a journal and a visualizer.
          for example in ${{ env.EXAMPLES }}; do
            echo "::group::$example"
            cd "$GITHUB_WORKSPACE/examples/terraform/$example"
            terraform init -input=false
            terraform apply -auto-approve -input=false

            # The real bar: a second plan must find nothing to do. Anything
            # else means we echo a field differently from the way it was sent.
            # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes.
            set +e
            terraform plan -detailed-exitcode -input=false
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::$example: plan -detailed-exitcode returned $code; expected 0 (no changes)"
              exit 1
            fi

            terraform destroy -auto-approve -input=false
            echo "::endgroup::"
          done

      - name: a file big enough that the CLI splits it
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          E="--endpoint-url http://localhost:4702"

          # 20 MB, which is past the 8 MB multipart_threshold, so the CLI
          # switches protocol on its own: CreateMultipartUpload, concurrent
          # UploadParts, CompleteMultipartUpload. It also DOWNLOADS with
          # concurrent ranged GETs, which is the half that silently
          # corrupted the file before Milestone 12 -- a 20,000,000-byte
          # upload came back as 36,777,216 bytes with nothing erroring.
          head -c 20000000 /dev/urandom > /tmp/big.bin
          aws $E s3 mb s3://multipart-demo
          aws $E s3 cp /tmp/big.bin s3://multipart-demo/big.bin
          aws $E s3 cp s3://multipart-demo/big.bin /tmp/back.bin

          cmp /tmp/big.bin /tmp/back.bin || {
            echo "::error::the file did not round-trip byte for byte"
            ls -l /tmp/big.bin /tmp/back.bin
            exit 1; }

          # A multipart object's ETag is the digest of the PART digests with
          # a -N suffix, never the MD5 of the bytes. A plain etag here would
          # mean the parts were reassembled and then re-hashed as one.
          etag=$(aws $E s3api head-object --bucket multipart-demo --key big.bin \
            --query ETag --output text)
          case "$etag" in
            *-*) ;;
            *) echo "::error::ETag $etag has no part count; this is not a multipart object"; exit 1 ;;
          esac

          aws $E s3 rm s3://multipart-demo/big.bin
          aws $E s3 rb s3://multipart-demo

      - name: Nothing left behind
        run: |
          # Each cloud keeps its root container -- a subscription, an
          # account, a project -- and nothing else may survive a destroy.
          remaining=$(curl -sf "http://localhost:4700/api/resources" \
            | grep -o '"type":"[^"]*"' \
            | grep -v 'Microsoft.Resources/subscriptions' \
            | grep -v 'AWS::Account' \
            | grep -v 'cloudresourcemanager.googleapis.com/Project' || true)
          if [ -n "$remaining" ]; then
            echo "::error::destroy left resources behind:"
            echo "$remaining"
            exit 1
          fi

  terraform-windows:
    name: terraform examples (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # so exit codes reach us unchanged

      # Until Milestone 18 the Windows leg only compiled and unit-tested.
      # No Windows machine had ever run Terraform against Nimbus, and three
      # platform bugs had reached main by only ever being proven on a Mac.
      #
      # Deliberately NO Docker: GitHub's windows-latest runners have no
      # daemon for Linux containers, so every Docker-backed example is out of
      # reach here. That is a limitation of the runner rather than an
      # oversight, and it is why the Lambda, Container App and k3s examples
      # are proven on a person's machine instead. These two need nothing but
      # the binary: azure-basic covers ARM over TLS and so the certificate
      # path, aws-basic covers SigV4 routing, EC2, IAM and S3 on NTFS.
      - name: Build Nimbus and write its CA
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/nimbus.exe ./cmd/nimbus
          ./bin/nimbus.exe cert

      # The CA goes into the certificate store, which is what `nimbus cert`
      # tells a person to do -- so this step VERIFIES that advice on every
      # run rather than taking a shortcut around it.
      #
      # The shortcut was tried first and does not work: SSL_CERT_FILE. Go's
      # own net/http honours it on Windows (measured), but the azurerm
      # PROVIDER does not -- proven by pointing it at a nonexistent file and
      # watching a plan succeed anyway, which it could only do by reading the
      # trust store. The provider is a separate binary built with its own Go
      # version, and whatever it honours is not ours to choose. On Windows
      # the trust store is the mechanism that matters.
      #
      # LocalMachine rather than the CurrentUser\Root that `nimbus cert`
      # advises, and the difference is about CI rather than about Windows.
      # Adding to the CURRENT USER's Root store raises a trust confirmation
      # dialog, which on a runner has nothing to answer it: the first
      # attempt hung until the run was cancelled, having printed nothing.
      # A runner is already an administrator, and an admin writing to
      # LocalMachine\Root is taken as consent, so it completes silently.
      #
      # So what CI checks here is that the CERTIFICATE works, not the exact
      # store `nimbus cert` names. The CurrentUser path was verified by hand
      # on a real Windows machine in Milestone 18 -- a person clicks the
      # dialog, which is the whole reason that store needs no elevation.
      - name: Trust the CA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ca = Join-Path $env:USERPROFILE ".nimbus\certs\nimbus-ca.pem"
          Write-Host "importing $ca"
          Import-Certificate -FilePath $ca -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $found = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object { $_.Subject -like '*Nimbus*' }
          if (-not $found) { throw "the Nimbus CA is not in LocalMachine\Root after importing it" }
          Write-Host "trusted: $($found.Subject)"

      - name: Start Nimbus
        shell: bash
        run: |
          set -euo pipefail
          ./bin/nimbus.exe start --clouds azure,aws,gcp &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, plan, destroy
        shell: bash
        working-directory: examples/terraform
        run: |
          set -euo pipefail
          for example in azure-basic aws-basic; do
            echo "::group::$example"
            cd "$GITHUB_WORKSPACE/examples/terraform/$example"
            terraform init -input=false
            terraform apply -auto-approve -input=false

            set +e
            terraform plan -detailed-exitcode -input=false
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::$example: plan -detailed-exitcode returned $code; expected 0 (no changes)"
              exit 1
            fi

            terraform destroy -auto-approve -input=false
            echo "::endgroup::"
          done

  # --- surviving a restart (Milestone 19) ----------------------------------
  #
  # Every other Terraform job is apply, verify and destroy inside ONE
  # process, so until these existed the whole persistence and adoption path
  # was exercised only when somebody happened to restart at the right
  # moment. Four of Milestone 18's six bugs lived there, and all four were
  # found by hand.
  #
  # Two jobs rather than one: this cheap one gives fast feedback with no
  # Docker at all, and restart-docker below pays for a daemon to prove the
  # harder half -- that a container which outlived the process is adopted
  # and still WORKS.
  restart-control-plane:
    name: restart with --persist (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Start Nimbus with --persist
        run: |
          set -euo pipefail
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus cert
          ./bin/nimbus start --clouds azure,aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, RESTART, plan clean, destroy
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"

          for example in azure-basic aws-basic; do
            cd "$GITHUB_WORKSPACE/examples/terraform/$example"
            terraform init -input=false
            terraform apply -auto-approve -input=false
          done

          # The restart. SIGTERM, wait for the port to close, start again
          # over the same --home so the state on disk is what it reads.
          echo "::group::restarting Nimbus"
          kill "$(cat /tmp/nimbus.pid)"
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null || break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          ./bin/nimbus start --clouds azure,aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info
          echo "::endgroup::"

          # A clean plan AFTER the restart is the real assertion. It means
          # every field round-tripped through disk exactly as it was sent:
          # anything re-typed, dropped or re-generated on load shows up here
          # as a diff. "It is still listed" would pass while badly broken.
          for example in azure-basic aws-basic; do
            cd "$GITHUB_WORKSPACE/examples/terraform/$example"
            set +e
            terraform plan -detailed-exitcode -input=false
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::$example: plan after a restart returned $code; expected 0 (no changes)"
              exit 1
            fi
            terraform destroy -auto-approve -input=false
          done

  restart-docker:
    name: restart with --persist (Lambda must still answer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the Lambda base image
        run: docker pull public.ecr.aws/lambda/python:3.12

      - name: Start Nimbus with --persist
        run: |
          set -euo pipefail
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, RESTART, invoke, destroy
        working-directory: examples/terraform/aws-serverless
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          E="--endpoint-url http://localhost:4702"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          # With --persist the container outlives the process deliberately,
          # so after the restart it must be ADOPTED rather than forgotten.
          echo "::group::restarting Nimbus"
          kill "$(cat /tmp/nimbus.pid)"
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null || break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          ./bin/nimbus start --clouds aws --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE/examples/terraform/aws-serverless"
          echo "::endgroup::"

          # THE assertion of this milestone: the function must still ANSWER.
          #
          # Before 0.18.1 this is exactly where it failed -- the store
          # survived and the engine's registry did not, so the function read
          # back Active and every invoke returned ResourceNotReadyException
          # while its container sat plainly Up in `docker ps`. Checking that
          # the resource is still listed would have passed throughout.
          printf '{"id":"after-restart"}' > payload.json
          aws $E lambda invoke --function-name nimbus-writer \
            --payload fileb://payload.json out.json
          cat out.json
          grep -q "after-restart" out.json || {
            echo "::error::the Lambda did not run after the restart"; exit 1; }

          terraform destroy -auto-approve -input=false

          # A delete must reach a container it only knows about through
          # adoption. Before 0.18.1 this leaked one on every destroy.
          left=$(docker ps -aq --filter "name=nimbus-" | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::destroy left $left nimbus container(s) behind"
            docker ps -a --filter "name=nimbus-"
            exit 1
          fi

  iam-enforced:
    name: terraform *-enforced (--enforce-iam, all three clouds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # so exit codes reach us unchanged

      - name: Start Nimbus with enforcement on
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          # The certificate is only needed for Azure: AWS and GCP are plain
          # HTTP, so nothing has to be trusted for those.
          ./bin/nimbus cert
          # All three clouds in ONE enforcing process, which is the point:
          # three policy languages, one decision engine, one store.
          ./bin/nimbus start --clouds azure,aws,gcp --enforce-iam &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      # Turning the flag on must cost nothing, because an unmapped caller
      # is the account ROOT -- which in real AWS carries no policies and
      # can do anything. So an example that knows nothing about IAM has to
      # apply, plan clean and destroy against an ENFORCING server exactly
      # as it does without the flag. Verified on macOS before this job
      # existed; this is what keeps it true.
      - name: an ordinary example is unaffected by the flag
        working-directory: examples/terraform/aws-basic
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false
          set +e
          terraform plan -detailed-exitcode -input=false
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::aws-basic plan returned $code with --enforce-iam on; expected 0"
            exit 1
          fi
          terraform destroy -auto-approve -input=false

      # Both directions. An emulator that refused everything would pass
      # the first half of this, which is why the second half is here.
      - name: an apply that must FAIL, and then succeed
        working-directory: examples/terraform/aws-iam-enforced
        run: |
          set -euo pipefail
          terraform init -input=false

          set +e
          out=$(terraform apply -auto-approve -input=false 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::error::the apply succeeded; nothing was refused, so enforcement is not working"
            exit 1
          fi
          # The message matters as much as the refusal: a client that
          # cannot recognise a denial retries it instead of reporting it.
          for want in AccessDenied s3:PutObject nimbus-app; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the failure does not mention $want"; exit 1 ;;
            esac
          done

          # And the same apply succeeds once the policy grants the action.
          terraform apply -auto-approve -input=false -var grant_write=true

          # A clean plan afterwards, the bar every other example meets.
          set +e
          terraform plan -detailed-exitcode -input=false -var grant_write=true
          plan=$?
          set -e
          if [ "$plan" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $plan; expected 0 (no changes)"
            exit 1
          fi

      # The finding that mattered most: a denied READ fails the plan rather
      # than looking like "the object is gone". If it ever started reading
      # as gone, Terraform would plan to recreate things that exist, and
      # enforcement would be worse than useless. This pins it.
      - name: a denied read fails the plan, and does not plan a create
        working-directory: examples/terraform/aws-iam-enforced
        run: |
          set -euo pipefail
          # Revoke the read while the object stays in state.
          terraform apply -auto-approve -input=false -var grant_write=true -var grant_read=false

          set +e
          out=$(terraform plan -input=false -var grant_write=true -var grant_read=false 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::error::a plan whose refresh cannot read the object succeeded"
            exit 1
          fi
          case "$out" in
            *"1 to add"*|*"must be replaced"*)
              echo "::error::a denied read was taken for a missing object; Terraform planned a create"
              exit 1 ;;
          esac

          # A HEAD response has no body, by HTTP's own rule, so the error
          # document is discarded and a client sees only "Forbidden" --
          # measured against aws provider 5.100.0, which reports exactly
          # that for this refusal and names no permission. The reason
          # travels in a header of our own instead. Checked HERE, while the
          # role genuinely lacks the read: an access key that maps to
          # nothing is the account root, which is allowed everything.
          reason=$(curl -s -I --max-time 10 \
            -H "Authorization: AWS4-HMAC-SHA256 Credential=nimbus-app/$(date -u +%Y%m%d)/us-east-1/s3/aws4_request, Signature=x" \
            "http://localhost:4702/nimbus-enforced/reports/today.txt" \
            | tr -d '\r' | grep -i '^x-nimbus-denied:' || true)
          echo "$reason"
          case "$reason" in
            *s3:GetObject*) ;;
            *) echo "::error::a refused HEAD did not carry its reason in X-Nimbus-Denied"; exit 1 ;;
          esac

          # Recovering needs -refresh=false, because the refresh is what
          # fails: the permission that would let it read cannot be restored
          # by a plan that cannot complete. Real AWS behaves the same way,
          # and it is worth knowing before meeting it on something real.
          terraform apply -refresh=false -auto-approve -input=false \
            -var grant_write=true -var grant_read=true
          terraform destroy -auto-approve -input=false -var grant_write=true

      # The half identity-based evaluation could not express: the ONLY
      # thing granting this role is the bucket's own policy. Its inline
      # policy says sts:GetCallerIdentity and nothing else, so an allow
      # cannot have come from the caller's side.
      - name: aws-bucket-policy-enforced, and public access
        working-directory: examples/terraform/aws-bucket-policy-enforced
        env:
          AWS_ACCESS_KEY_ID: nimbus
          AWS_SECRET_ACCESS_KEY: nimbus
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -auto-approve -input=false

          read_as() {   # read_as <key> <bucket> -> prints the body or "DENIED"
            AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY=nimbus \
              aws --endpoint-url http://localhost:4702 \
              s3 cp "s3://$2/hello.txt" - 2>/dev/null || echo DENIED
          }

          # Granted by the bucket, refused by the one without a policy.
          case "$(read_as nimbus-reader nimbus-open)" in
            *"bucket says so"*) ;;
            *) echo "::error::the bucket policy did not grant the read"; exit 1 ;;
          esac
          case "$(read_as nimbus-reader nimbus-closed)" in
            DENIED) ;;
            *) echo "::error::a bucket with no policy allowed the read"; exit 1 ;;
          esac

          anon() {
            aws --endpoint-url http://localhost:4702 --no-sign-request \
              s3 cp s3://nimbus-open/hello.txt - 2>/dev/null || echo DENIED
          }

          # No credentials at all. Refused until the policy says
          # Principal: "*" -- an unsigned request used to resolve to the
          # account ROOT, which is unrestricted, so this is the assertion
          # that the anonymous principal exists.
          test "$(anon)" = DENIED || {
            echo "::error::an unsigned request was allowed on a non-public bucket"; exit 1; }

          terraform apply -auto-approve -input=false -var public=true
          case "$(anon)" in
            *"bucket says so"*) ;;
            *) echo "::error::Principal: \"*\" did not make the bucket public"; exit 1 ;;
          esac

          # The case worth the trouble: the policy STILL says `*` and the
          # bucket is not public. A badge read off the document rather
          # than from the evaluator would be wrong exactly here.
          terraform apply -auto-approve -input=false -var public=true -var block_public_access=true
          test "$(anon)" = DENIED || {
            echo "::error::a public access block did not take public access away"; exit 1; }
          case "$(read_as nimbus-reader nimbus-open)" in
            *"bucket says so"*) ;;
            *) echo "::error::the block also refused a NAMED principal"; exit 1 ;;
          esac

          # An explicit Deny beats an Allow in the caller's own policy --
          # which this role does not even have, so it beats the bucket's
          # own Allow above.
          terraform apply -auto-approve -input=false -var deny_everyone=true
          test "$(read_as nimbus-reader nimbus-open)" = DENIED || {
            echo "::error::an explicit Deny in the bucket policy did not win"; exit 1; }

          terraform destroy -auto-approve -input=false -var deny_everyone=true

      # Azure. The example is two root modules, and the reason is measured:
      # azurerm reads the subscription when the provider CONFIGURES, so a
      # principal cannot be granted, in the same apply, the access its own
      # provider needs in order to start. See the example's header.
      - name: azure-rbac-enforced, and the inheritance it is for
        env:
          # Go on Linux honours SSL_CERT_FILE; azurerm inherits it.
          SSL_CERT_FILE: /home/runner/.nimbus/certs/nimbus-ca.pem
        working-directory: examples/terraform/azure-rbac-enforced
        run: |
          set -euo pipefail

          cd platform
          terraform init -input=false
          terraform apply -auto-approve -input=false

          cd ../app
          terraform init -input=false
          set +e
          out=$(terraform apply -auto-approve -input=false 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the apply succeeded; nothing was refused"
            exit 1
          fi
          # The data source READ succeeds while the write is refused, which
          # is the distinction RBAC exists to draw. And the message has to
          # name the principal, the action and the scope, as Azure's does.
          for want in AuthorizationFailed Microsoft.Network/virtualNetworks/write \
                      22222222-2222-2222-2222-222222222222; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the failure does not mention $want"; exit 1 ;;
            esac
          done

          # Grant Network Contributor at the RESOURCE GROUP, and the same
          # apply succeeds -- with no change to the app's own configuration.
          # That is the whole example: what changed was the permission.
          cd ../platform && terraform apply -auto-approve -input=false -var grant=true
          cd ../app && terraform apply -auto-approve -input=false

          set +e
          terraform plan -detailed-exitcode -input=false
          plan=$?
          set -e
          if [ "$plan" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $plan; expected 0"
            exit 1
          fi

          # Azure's OTHER axis. The vault role is still Key Vault Reader,
          # which can list secrets and not read their values -- and
          # `actions` say nothing about it: the same principal holds
          # Network Contributor and just created a VNet.
          #
          # read_secret is opt-in because a DATA SOURCE is read during the
          # PLAN: left on, this refusal would fail the plan before the
          # VNet write above was ever attempted, hiding the control-plane
          # lesson instead of adding to it.
          set +e
          out=$(terraform apply -auto-approve -input=false -var read_secret=true 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::reading the secret succeeded; dataActions decided nothing"
            exit 1
          fi
          for want in Forbidden Microsoft.KeyVault/vaults/secrets/getSecret/action; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the data-action refusal does not mention $want"; exit 1 ;;
            esac
          done

          # Grant Key Vault Secrets User and the SAME apply succeeds, with
          # nothing in the app's configuration changed -- as with the
          # control-plane grant above.
          cd ../platform && terraform apply -auto-approve -input=false \
            -var grant=true -var secrets_user=true
          cd ../app && terraform apply -auto-approve -input=false -var read_secret=true
          test "$(terraform output -raw secret)" = "hunter2" || {
            echo "::error::the secret did not read back"; exit 1; }

          # The app module first: the platform module owns the resource
          # group, and destroying that would take the VNet with it.
          terraform destroy -auto-approve -input=false -var read_secret=true
          cd ../platform && terraform destroy -auto-approve -input=false \
            -var grant=true -var secrets_user=true

      # GCP. ONE module, unlike Azure's two, because the google provider
      # makes no startup calls -- a Milestone 10 finding paying for itself.
      - name: gcp-iam-enforced
        working-directory: examples/terraform/gcp-iam-enforced
        run: |
          set -euo pipefail
          terraform init -input=false

          set +e
          out=$(terraform apply -auto-approve -input=false 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the apply succeeded; nothing was refused"
            exit 1
          fi
          # What the PROVIDER actually prints. Measured here, by this
          # assertion failing: the google provider surfaces `error.message`
          # and `error.errors[].reason` ("forbidden") but NOT
          # `error.status`, so PERMISSION_DENIED never reaches the
          # terraform output. The status enum is for a client to match on,
          # not for a person to read -- so it is checked below, against
          # the response body, where it is actually true.
          for want in "Error 403" storage.objects.create \
                      "serviceAccount:app@nimbus-local.iam.gserviceaccount.com"; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the failure does not mention $want"; exit 1 ;;
            esac
          done

          # PERMISSION_DENIED is in the BODY, which is what an SDK reads to
          # tell a refusal from anything else.
          body=$(curl -s -o - -w '' \
            -H "Authorization: Bearer serviceAccount:app@nimbus-local.iam.gserviceaccount.com" \
            -X DELETE "http://localhost:4703/storage/v1/b/nimbus-iam-enforced")
          echo "$body"
          case "$body" in
            *PERMISSION_DENIED*) ;;
            *) echo "::error::the refusal body does not carry PERMISSION_DENIED"; exit 1 ;;
          esac

          terraform apply -auto-approve -input=false -var grant=true

          # With the SAME vars, or the plan compares against grant=false and
          # is dirty for a reason that has nothing to do with enforcement.
          set +e
          terraform plan -detailed-exitcode -input=false -var grant=true
          plan=$?
          set -e
          if [ "$plan" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $plan; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false -var grant=true

      - name: Nothing left behind
        run: |
          # Each cloud keeps its root container and nothing else may
          # survive a destroy.
          remaining=$(curl -sf "http://localhost:4700/api/resources" \
            | grep -o '"type":"[^"]*"' \
            | grep -v 'Microsoft.Resources/subscriptions' \
            | grep -v 'AWS::Account' \
            | grep -v 'cloudresourcemanager.googleapis.com/Project' || true)
          if [ -n "$remaining" ]; then
            echo "::error::destroy left resources behind:"
            echo "$remaining"
            exit 1
          fi

  functions:
    name: terraform azure-functions (Functions host, built image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Docker and the Functions host image
        run: |
          docker version --format '{{.Server.Version}}'
          # About 1.5 GB. Pre-pulled so the apply measures Nimbus rather
          # than the network -- and because a `docker build` whose FROM is
          # missing would reach a registry, which is the one thing this
          # project will not do. Nimbus pulls the base through the
          # ordinary path for exactly that reason.
          docker pull mcr.microsoft.com/azure-functions/python:4-python3.11

      - name: Vendor the function's dependencies
        working-directory: examples/terraform/azure-functions/handler
        run: |
          # The one step real Azure does for you, with a remote build that
          # needs the network. The host image ships the host and the
          # Python worker but NOT azure-functions, so without this every
          # invocation would fail on `import azure.functions` -- and
          # Nimbus refuses the deploy rather than letting that happen.
          pip install --target .python_packages/lib/site-packages -r requirements.txt
          test -d .python_packages/lib/site-packages/azure

      - name: Start Nimbus with --persist
        run: |
          set -euo pipefail
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds azure --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, call the function, RESTART, destroy
        working-directory: examples/terraform/azure-functions
        run: |
          set -euo pipefail
          # Go on Linux honours SSL_CERT_FILE, so the CA does not have to
          # go in the system store here. On WINDOWS the azurerm provider
          # ignores it and the certificate store is the mechanism that
          # matters -- measured in Milestone 18, which is why the Windows
          # job imports the CA instead.
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"

          terraform init -input=false
          terraform apply -auto-approve -input=false

          HOST=$(terraform output -raw hostname)
          echo "hostname: $HOST"

          # THE assertion: the function answers with what the handler
          # returned. Microsoft's own host, running the real programming
          # model, reached through a hostname Nimbus invented.
          out=$(curl -s --fail --max-time 60 "https://$HOST/api/hello?name=ci")
          echo "GET  -> $out"
          [ "$out" = "hello ci from azure functions" ] || {
            echo "::error::the function did not return what the handler returns"; exit 1; }

          # And a POST, so the body path is exercised too.
          out=$(curl -s --fail --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"posted"}' "https://$HOST/api/hello")
          echo "POST -> $out"
          [ "$out" = "hello posted from azure functions" ] || {
            echo "::error::the POST body did not reach the handler"; exit 1; }

          # The handler's own output, beside the host's record of the
          # invocation. Both are in the container console, which is where
          # a function app's logs live here -- real Azure routes them
          # through Application Insights, which Nimbus does not model.
          C=$(docker ps -qf label=nimbus.role=functionapp | head -1)
          docker logs "$C" 2>&1 | tail -40 > logs.txt
          grep -q "hello called for ci" logs.txt || {
            echo "::error::the handler's print is not in the container console"
            cat logs.txt; exit 1; }
          grep -q "Executed 'Functions.hello' (Succeeded" logs.txt || {
            echo "::error::the host did not record the invocation"
            cat logs.txt; exit 1; }

          # Does a CONTAINER actually reach Azure's data plane?
          #
          # The unit tests prove Nimbus puts the right --add-host flags and
          # CA mount on the command line, and the docker package's own
          # real-Docker test proves an alias resolves to the host. Neither
          # proves the AZURE WIRING end to end: that DataPlaneHosts emits
          # the name a client really builds, that it resolves inside this
          # container, and that the mounted CA verifies the certificate in
          # front of it. Until this step existed a fully green run proved
          # the flags were well formed, not that they worked -- and the one
          # bug that did reach CI was a name carrying a port, which every
          # assertion above is blind to.
          #
          # The suffix comes from the metadata document rather than being
          # hard-coded, so the port is the running server's.
          # --cacert explicitly: whether curl honours SSL_CERT_FILE
          # depends on what it was built against, and a silent empty
          # response here would fail further down naming the wrong thing.
          META="https://localhost:4701/metadata/endpoints?api-version=2022-09-01"
          SUFFIX=$(curl -sS --cacert "$SSL_CERT_FILE" "$META" | python -c 'import json,sys; print(json.load(sys.stdin)["suffixes"]["storage"])')
          BLOB_HOST="stnimbusfunctions.blob.$SUFFIX"
          echo "blob host: $BLOB_HOST"

          docker exec -e BLOB_HOST="$BLOB_HOST" "$C" python -c '
          import os, socket, sys, urllib.error, urllib.request

          host = os.environ["BLOB_HOST"]
          name = host.split(":")[0]

          # The name must resolve, and NOT to loopback: nested *.localhost
          # resolves to 127.0.0.1, which inside a container is the
          # container, and that is the whole bug being guarded against.
          addr = socket.gethostbyname(name)
          print("resolved", name, "->", addr)
          if addr.startswith("127.") or addr == "::1":
              sys.exit("FAIL: %s resolves to loopback inside the container" % name)

          # Then a request has to reach it over VERIFIED TLS. ANY http
          # status is a pass: an unauthenticated request is refused by
          # design, and a 40x still proves DNS, reachability and the
          # certificate. Demanding 200 would couple this to auth it is not
          # about. SSL_CERT_FILE is set by Nimbus and honoured by
          # ssl.create_default_context, so this covers the mount too.
          print("SSL_CERT_FILE =", os.environ.get("SSL_CERT_FILE"))
          try:
              with urllib.request.urlopen("https://%s/?comp=list" % host, timeout=30) as r:
                  print("status", r.status)
          except urllib.error.HTTPError as e:
              print("status", e.code, "(a refusal still proves TLS and reachability)")
          except Exception as e:
              sys.exit("FAIL: could not reach %s: %s: %s" % (host, type(e).__name__, e))
          print("the data plane was reached from inside the container")
          ' || { echo "::error::a container could not reach the Azure data plane"; exit 1; }

          # A clean plan, which means every field round-tripped exactly as
          # sent. Several of this milestone's bugs were permanent diffs
          # that a "the resource exists" check would have missed:
          # siteConfig.http20Enabled defaulted to Microsoft's true where
          # azurerm's schema says false, and properties.backup answered as
          # an empty document that azurerm flattened into a block.
          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0"
            exit 1
          fi

          # The restart. With --persist the container outlives the
          # process, so it must be ADOPTED -- and into the FUNCTION APP
          # engine, not the container-app one: the two share this engine
          # and used to share a role label, so each adopted the other's
          # containers.
          echo "::group::restarting Nimbus"
          kill "$(cat /tmp/nimbus.pid)"
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null || break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          ./bin/nimbus start --clouds azure --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE/examples/terraform/azure-functions"
          echo "::endgroup::"

          # POLLED, because /api/info answering does not mean reattach has
          # finished: it runs in the startup goroutine. Measured at about
          # three seconds, and the first attempt at this reported a
          # failure purely by asking too early.
          after=""
          for i in $(seq 1 40); do
            after=$(curl -s --max-time 20 "https://$HOST/api/hello?name=after" 2>/dev/null || true)
            case "$after" in *"hello after"*) echo "adopted after ${i}s"; break ;; esac
            sleep 1
          done
          case "$after" in
            *"hello after"*) ;;
            *) echo "::error::the function did not answer after the restart: $after"; exit 1 ;;
          esac

          set +e; terraform plan -detailed-exitcode -input=false; code=$?; set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan after the restart returned $code; expected 0"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

      - name: Nothing left behind, and the shared base image kept
        run: |
          left=$(docker ps -aq --filter label=nimbus.role=functionapp | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::destroy left $left function-app container(s)"
            docker ps -a --filter label=nimbus.role=functionapp
            exit 1
          fi
          # A BUILT image belongs to its resource alone and must go. This
          # one leaked for a while: after a restart the engine remembers
          # nothing about having built it, and nothing in `docker ps`
          # would ever have shown a 3 GB image sitting there.
          images=$(docker images -q --filter 'reference=nimbus-fnapp-*' | wc -l)
          if [ "$images" -ne 0 ]; then
            echo "::error::destroy left $images built image(s)"
            docker images --filter 'reference=nimbus-fnapp-*'
            exit 1
          fi
          # And the shared base image must STAY: removing it because one
          # app used it would break every other app and cost a 1.5 GB
          # re-pull.
          base=$(docker images -q mcr.microsoft.com/azure-functions/python:4-python3.11 | wc -l)
          if [ "$base" -ne 1 ]; then
            echo "::error::the shared base image was removed; only built images are ours"
            exit 1
          fi

  containerapp:
    name: terraform azure-containerapp (run engine + Log Analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Docker and the app images
        run: |
          docker version --format '{{.Server.Version}}'
          # Pre-pulled so the apply measures Nimbus rather than the
          # network. The engine pulls them itself when they are missing,
          # which is what makes the create genuinely long-running.
          docker pull nginx:alpine
          # The example's sidecar.
          docker pull redis:alpine

      - name: Start Nimbus with --persist
        run: |
          go build -o bin/nimbus ./cmd/nimbus
          ./bin/nimbus start --clouds azure --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4700/api/info

      - name: apply, curl the app, query its logs, RESTART, destroy
        working-directory: examples/terraform/azure-containerapp
        run: |
          set -euo pipefail
          # Go on Linux honours SSL_CERT_FILE, so the CA does not have to
          # be installed into the system store -- the line every azurerm
          # job here uses.
          export SSL_CERT_FILE="$HOME/.nimbus/certs/nimbus-ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false

          FQDN=$(terraform output -raw fqdn)
          WS=$(terraform output -raw workspace_customer_id)

          # The app is up the moment the apply returns, because the create
          # is long-running through Hook.Provision and azurerm polls the
          # RESOURCE until it is Succeeded -- measured, see the example's
          # header. So this needs no wait.
          curl -sk --fail --max-time 30 "https://$FQDN/" > /tmp/app.html
          grep -qi nginx /tmp/app.html || {
            echo "::error::the app's FQDN did not serve what the image serves"
            cat /tmp/app.html; exit 1; }

          # The request above went THROUGH Nimbus, so it is in the feed.
          # That is the reason for proxying rather than publishing the
          # container's port.
          curl -sf "http://localhost:4700/api/resources" >/dev/null

          # The template has two containers and min_replicas = 2, so FOUR
          # containers run: two replicas of the group, each with its own
          # cache. Before this, a sidecar was stored and not started and
          # min_replicas round-tripped as state, so an app like this one
          # applied cleanly and ran a single container -- which is worse
          # than an error, because nothing said so.
          replicas=$(docker ps -q --filter label=nimbus.role=service | wc -l)
          sidecars=$(docker ps -q --filter label=nimbus.role=sidecar | wc -l)
          echo "replicas=$replicas sidecars=$sidecars"
          if [ "$replicas" -ne 2 ] || [ "$sidecars" -ne 2 ]; then
            echo "::error::expected 2 replicas and 2 sidecars, got $replicas and $sidecars"
            docker ps --filter label=nimbus.resource --format '{{.Names}} {{.Image}}'
            exit 1
          fi

          # Each sidecar must be in its OWN replica's namespace. Sharing
          # one would mean a replica had both or neither, and localhost is
          # per namespace -- which is the entire reason a sidecar exists.
          spaces=$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            $(docker ps -q --filter label=nimbus.role=sidecar) | sort -u | wc -l)
          if [ "$spaces" -ne 2 ]; then
            echo "::error::the two sidecars share a namespace, so one replica has both"
            exit 1
          fi

          # THE assertion: the cache answers on localhost from inside the
          # app container. If this passes, the group is a real group.
          app=$(docker ps -q --filter label=nimbus.role=service | head -1)
          docker exec "$app" sh -c 'nc -z 127.0.0.1 6379' || {
            echo "::error::the sidecar is not reachable on localhost from its app"
            exit 1; }
          echo "the sidecar answers on localhost"

          # And requests are SPREAD, not all sent to the first replica --
          # which would look honoured and not be. nginx logs each one, so
          # the counts are readable from the containers themselves.
          for i in $(seq 1 6); do
            curl -sk --max-time 10 -o /dev/null "https://$FQDN/" || true
          done
          served=0
          for c in $(docker ps -q --filter label=nimbus.role=service); do
            n=$(docker logs "$c" 2>&1 | grep -c "GET /" || true)
            echo "replica $c served $n"
            if [ "${n:-0}" -gt 0 ]; then served=$((served + 1)); fi
          done
          if [ "$served" -lt 2 ]; then
            echo "::error::only $served of two replicas served anything; requests are not spread"
            exit 1
          fi

          # Its console has to reach the workspace. The tailer polls every
          # three seconds, so wait for a line rather than racing it --
          # "the apply returned" has never meant "the logs have arrived",
          # which is the lesson all three instance jobs learned.
          for i in $(seq 1 30); do
            lines=$(curl -sf "http://localhost:4700/api/loganalytics/logs?workspace=$WS" \
              | grep -c '"message"' || true)
            if [ "${lines:-0}" -gt 0 ]; then break; fi
            sleep 1
          done
          if [ "${lines:-0}" -eq 0 ]; then
            echo "::error::nothing from the app's console reached the workspace"
            exit 1
          fi
          echo "$lines log lines reached the workspace"

          # And the query API answers the document the az extension reads.
          # (The CLI command itself lives in the `log-analytics` extension,
          # which needs installing in a shell without REQUESTS_CA_BUNDLE,
          # so CI exercises the endpoint directly -- it is the same server
          # code either way.)
          query() {
            curl -sk --max-time 20 -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"query\":$1}" \
              "https://localhost:4701/loganalytics/v1/workspaces/$WS/query"
          }
          out=$(query '"ContainerAppConsoleLogs | take 5"')
          echo "$out" | head -c 400; echo
          for want in '"tables"' '"PrimaryResult"' '"columns"' '"rows"'; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the query answer is missing $want"; exit 1 ;;
            esac
          done

          # The widened subset, against a real workspace with real lines.
          # `summarize count() by` and `order by` used to be in the refusal
          # list below; they are implemented now, so they are asserted
          # POSITIVELY here rather than left out -- a test that only ever
          # checked they were refused would have passed while they broke.
          out=$(query '"ContainerAppConsoleLogs | summarize count() by ContainerAppName_s"')
          echo "$out"
          case "$out" in
            *count_*) ;;
            *) echo "::error::summarize count() by did not answer a count_ column"; exit 1 ;;
          esac

          # ago() is the one that matters most: it is in virtually every
          # real query and was refused outright, so a time window could not
          # be written at all. A one-hour window must hold lines the app
          # produced seconds ago.
          out=$(query '"ContainerAppConsoleLogs | where TimeGenerated > ago(1h) | count"')
          echo "$out"
          case "$out" in
            *'"rows":[[0]]'*)
              echo "::error::ago(1h) found no lines, though the app has just logged some"
              exit 1 ;;
            *'"rows"'*) ;;
            *) echo "::error::ago(1h) was not answered"; exit 1 ;;
          esac

          # A filter with two conditions, which `where` could not read
          # before: one comparison was the whole of it.
          out=$(query '"ContainerAppConsoleLogs | where Stream_s == \"stdout\" and Log_s contains \"\" | take 3"')
          echo "$out" | head -c 200; echo
          case "$out" in
            *'"rows"'*) ;;
            *) echo "::error::a where with and/or was not answered"; exit 1 ;;
          esac

          # And an operator that is still NOT implemented must be REFUSED
          # AND NAMED -- not treated as a no-op returning every row (the
          # FilterExpression trap), and not as an empty result, which reads
          # as "nothing logged yet".
          out=$(query '"ContainerAppConsoleLogs | extend n = 1"')
          echo "$out"
          case "$out" in
            *extend*) ;;
            *) echo "::error::an unsupported KQL operator was not refused by name"; exit 1 ;;
          esac

          # A workspace's rows used NOT to survive a restart, and losing
          # them did not fail loudly: a query simply returned nothing,
          # which is indistinguishable from a workspace nobody has used.
          before=$(query '"ContainerAppConsoleLogs | count"')
          echo "before the restart: $before"

          echo "::group::restarting Nimbus"
          kill "$(cat /tmp/nimbus.pid)"
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null || break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          ./bin/nimbus start --clouds azure --persist &
          echo $! > /tmp/nimbus.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4700/api/info >/dev/null && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE/examples/terraform/azure-containerapp"
          echo "::endgroup::"

          after=$(query '"ContainerAppConsoleLogs | count"')
          echo "after the restart: $after"
          case "$after" in
            *'"rows":[[0]]'*)
              echo "::error::the workspace lost its rows across the restart"
              exit 1 ;;
            *'"rows"'*) ;;
            *) echo "::error::the query did not answer after the restart"; exit 1 ;;
          esac

          set +e
          terraform plan -detailed-exitcode -input=false
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::plan -detailed-exitcode returned $code; expected 0 (no changes)"
            exit 1
          fi

          terraform destroy -auto-approve -input=false

      - name: Nothing left running
        run: |
          left=$(docker ps -a --filter label=nimbus.resource-id -q | wc -l | tr -d ' ')
          if [ "$left" != "0" ]; then
            echo "::error::destroy left $left container(s) behind:"
            docker ps -a --filter label=nimbus.resource-id
            exit 1
          fi
